<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<title>Lista de Eventos</title>
</head>
<body>

	<div th:replace="~{menu :: menu}"></div>

	<div class="container" style="margin-top: 30px;">
		<h3>Lista de eventos</h3>

		<table class="striped highlight">
			<thead>
				<tr>
					<th>Id</th>
					<th>Nome</th>
					<th>Local</th>
					<th>Data</th>
					<th>Horário</th>
					<th>Ações</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="e : ${eventos}">
					<td th:text="${e.id}">1</td>
					<td>
						<a th:href="@{/eventos/{id}(id=${e.id})}">
							<span th:text="${e.nome}">Aniversário de João</span>
						</a>
					</td>
					<td th:text="${e.local}">Clube</td>
					<td th:text="${e.data}">25/02/2021</td>
					<td th:text="${e.horario}">19:00</td>
					<td>
						<!-- Botão Editar (Acessa o método selecionarEvento) -->
						<a th:href="@{/eventos/{id}/selecionar(id=${e.id})}" class="btn-floating btn-small waves-effect waves-light blue">
							<i class="material-icons">edit</i>
						</a>

						<!-- Botão Apagar (Acessa o método apagarEvento) -->
						<a th:href="@{/eventos/{id}/remover(id=${e.id})}" class="btn-floating btn-small waves-effect waves-light red">
							<i class="material-icons">delete</i>
						</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>

</body>
</html>
