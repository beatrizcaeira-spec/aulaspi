<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Cadastro de Evento</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container" style="margin-top: 30px;">
		<h1>Cadastrar Evento</h1>

		<form action="/eventos" method="post">
			<!-- Campo oculto para guardar o ID no caso de edição -->
			<input type="hidden" name="id" th:value="${evento?.id}" />

			<div>
				<label>Nome:</label>
				<input type="text" name="nome" th:value="${evento?.nome}" required />
			</div>
			<div>
				<label>Local:</label>
				<input type="text" name="local" th:value="${evento?.local}" required />
			</div>
			<div>
				<label>Data:</label>
				<input type="text" name="data" th:value="${evento?.data}" placeholder="dd/mm/aaaa" required />
			</div>
			<div>
				<label>Horário:</label>
				<input type="text" name="horario" th:value="${evento?.horario}" placeholder="00:00" required />
			</div>

			<div style="margin-top: 15px;">
				<button class="waves-effect waves-light btn" type="submit">Salvar</button>
				<button class="waves-effect waves-light btn" type="reset">Limpar</button>
			</div>
		</form>
	</div>
</body>
</html>
