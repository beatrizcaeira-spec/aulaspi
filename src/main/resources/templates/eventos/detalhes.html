<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<!-- Compiled and minified CSS -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
<title>Eventos</title>
</head>
<body>
	<div th:replace="~{menu :: menu}"></div>

	<div class="container" style="margin-top: 30px;">

		<div class="row">
			<div class="col s12">
				<h3 class="header">Detalhes do evento</h3>
			</div>
		</div>

		<div class="row">
			<div class="col s12">
				<div class="card blue-grey darken-1">
					<div class="card-content white-text">
						<span class="card-title">Evento</span> <span
					
						<p>
							<strong>Id: </strong><span th:text="${evento.id}">1</span>
						</p>
						<p>
							<strong>Nome: </strong><span th:text="${evento.nome}">Aniversário
								de José</span>
						</p>
						<p>
							<strong>Local: </strong><span th:text="${evento.local}">Club</span>
						</p>
						<p>
							<strong>Data: </strong><span th:text="${evento.data}">25/02/2021</span>
						</p>
						<p>
							<strong>Horário: </strong><span th:text="${evento.horario}">20:00</span>
						</p>
					</div>

				</div>
			</div>
		</div>

	</div>
</body>
</html>
